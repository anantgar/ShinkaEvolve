max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 1
verbose: true

evo:
  seed_repo_path: seed_repo
  mutable_paths: []
  immutable_paths: []
  agent_hidden_paths: []
  language: python
  llm_models:
    - headless/codex
  llm_dynamic_selection: null
  embedding_model: null
  generation_target_mode: evaluated_candidates
  headless_proposal_timeout_seconds: 7200
  max_novelty_attempts: 1
  max_patch_resamples: 1
  max_patch_attempts: 1
  patch_types: [diff, full, cross]
  patch_type_probs: [0.6, 0.3, 0.1]
  task_sys_msg: >-
    Optimize this converted repository while preserving its public interface,
    correctness constraints, build, and runtime behavior. Keep changes coherent
    across files, validate them, and complete the required repository summary.

db:
  num_islands: 1
  archive_size: 20
  num_archive_inspirations: 1
  num_top_k_inspirations: 1

job:
  eval_program_path: evaluate.py
