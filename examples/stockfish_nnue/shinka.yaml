# prepare.py writes a campaign copy with pinned images, source and baseline.
# Fill mutation authentication using the existing secure headless setup.
evo:
  evaluation_mode: secure
  seed_repo_path: seed_repo
  mutation_image: null
  mutable_paths: []
  llm_models: [headless/codex@gpt-6-sol]
  embedding_model: null
  llm_dynamic_selection: null
  agent_auth_profiles: {}
  agent_credential_env_names: {}
  agent_network: provider_only
  agent_provider_network: shinka-provider-egress
  agent_provider_proxy: http://shinka-egress-proxy:8080
  patch_types: [full]
  patch_type_probs: [1.0]
  max_patch_attempts: 2
  task_sys_msg: >-
    Optimize Stockfish's exact integer NNUE inference on the campaign CPU.
    Read SHINKA_TASK.md. Preserve weights, architecture, feature definitions,
    quantization, all raw outputs and the public interface. Change only allowed
    NNUE implementation files. Pursue useful SIMD, layout, sparse computation,
    accumulator update, cache-locality and instruction-scheduling improvements.
    No result memoization, benchmark recognition, IO, clock manipulation,
    additional threads, search changes or compiler-flag changes.
job:
  backend: local
  mutation_dependency_scope: runtime
  evaluator_repo_path: evaluator
  evaluator_entrypoint: evaluate.py
  private_data_manifest: private-data.yaml
  dependency_manifest_path: dependencies.json
  build_image: null
  runtime_image: null
  build_command: []
  candidate_command: [python3, /candidate/service.py, /candidate/nnue_replay, /dependencies/files/network.nnue]
  required_paths: [src/nnue/nnue_accumulator.cpp, src/nnue/nnue_feature_transformer.h]
  public_metric_allowlist: [geometric_speedup, log_standard_error, pair_count]
  sandbox_user: '65532:65532'
  cpus: 2
  cpu_set: '2'
  memory_bytes: 4294967296
  pids: 128
  request_timeout_seconds: 180
  wall_timeout_seconds: 5400
  queue_timeout_seconds: 7200
  aws_job_timeout_seconds: 7200
  public_feedback_enabled: false
db:
  num_islands: 4
  archive_size: 40
max_evaluation_jobs: 1
max_proposal_jobs: 2
max_db_workers: 2
